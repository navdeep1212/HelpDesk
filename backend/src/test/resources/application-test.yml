# Test profile — uses H2 in-memory database.
# Flyway is DISABLED; Hibernate creates the schema from entity classes.
# This keeps tests fast and free of MySQL-specific DDL syntax.
#
# NOTE: To catch Flyway/MySQL schema drift, run integration tests
# against a real MySQL instance in CI (separate profile: application-mysql-test.yml).

spring:
  datasource:
    url: jdbc:h2:mem:helpdesk_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false   # Flyway off in tests; Hibernate owns schema here

app:
  jwt:
    # Test-only secret — 64+ chars to satisfy HS512 key-length requirement
    secret: test-only-secret-key-that-is-long-enough-for-hs512-algorithm-do-not-use-in-production
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080
  agent-bootstrap-secret: test-agent-bootstrap-secret
  agent-email: seedagent@helpdesk.local
  agent-password: SeedAgentPassword123!

logging:
  level:
    com.helpdesk: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
