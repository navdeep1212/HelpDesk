# MySQL Integration Test profile
# Runs Flyway migrations and validates Hibernate entities against a real MySQL test database.
# Activate with: -Dspring.profiles.active=mysql-test
# Requires a running MySQL test database specified by TEST_DB_URL or defaults.

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/helpdesk_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs512-algorithm-do-not-use-in-production
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080
  agent-bootstrap-secret: test-agent-bootstrap-secret
  agent-email: seedagent@helpdesk.local
  agent-password: SeedAgentPassword123!
