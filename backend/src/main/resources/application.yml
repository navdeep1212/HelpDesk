server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: helpdesk-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # NEVER use create or update in production.
      # Flyway owns schema lifecycle. Hibernate only validates.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 20
    open-in-view: false

  # Flyway is mandatory — migrations in db/migration/
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ── Application-specific config ───────────────────────────────
app:
  jwt:
    # HS512 — secret MUST be >= 64 random bytes (512 bits)
    # Generate: openssl rand -base64 64
    secret: ${JWT_SECRET}
    # Short-lived access token: 15 minutes (900000 ms)
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    # Refresh token: 7 days (604800000 ms)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    # Refresh cookie path: /api/auth covers /api/auth/refresh and /api/auth/logout
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth

  cors:
    # Explicit origins required (no wildcard — credentials=true is set)
    # Allows both frontend (localhost:5173) and backend/Swagger UI (localhost:8080)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

  # Only read by AgentSeedRunner when spring.profiles.active=seed
  agent-bootstrap-secret: ${AGENT_BOOTSTRAP_SECRET:}
  agent-email: ${AGENT_EMAIL:}
  agent-password: ${AGENT_PASSWORD:}

# ── Springdoc / Swagger UI ────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    with-credentials: true

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.helpdesk: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
